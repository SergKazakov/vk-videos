name: Build CLI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "canary"
      - run: bun install --frozen-lockfile
      - parallel:
          - run: bunx eslint
          - run: bunx tsc
          - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: cli
